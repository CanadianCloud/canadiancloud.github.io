name: Update events calendar

on:
  schedule:
    - cron: "0 7 * * *" # every day at midnight Vancouver time
  workflow_dispatch:

jobs:
  scrape-events:
    runs-on: ubuntu-latest
    env:
      # necessary for using `gh` cli
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for git diff to work properly
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: 'npm'
      
      - name: Install dependencies
        run: npm install
      
      # scrapes luma and updates events.json
      - name: Run events scraping script
        run: node index.js
      
      # check if events.json has changed, and if so, commit and push
      - name: Configure Git
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions"
      
      - name: Commit and push changes
        run: |
          if git diff --exit-code events.json; then
            echo "No event updates"
          else 
            echo "Changes detected - committing new events.json"
            git add events.json
            git commit -m "Update events calendar [automated]"
            git push
            
            # No need to trigger deploy manually as GitHub Pages will automatically
            # redeploy when changes are pushed to the main branch
            echo "Changes pushed. GitHub Pages will automatically deploy the updates."
          fi