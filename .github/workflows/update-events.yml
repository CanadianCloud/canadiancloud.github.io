name: Refresh community events and publish

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: cpca-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check the event parser and city filtering
        run: node --test tests/*.test.mjs
      - name: Refresh all public community calendars
        run: node scripts/update-events.mjs
      - name: Prepare GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare public website files
        run: |
          mkdir -p _site/assets _site/data
          cp index.html northern-lights.css app.js committee.html favicon.ico logo.png DSC5513.png CNAME robots.txt _site/
          cp assets/aurora.jpg assets/canada-map.svg _site/assets/
          cp data/events.json data/calendars.json _site/data/
          # Preserve existing public assets and QR landing pages.
          cp *.png _site/
          cp -R qr _site/qr
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
